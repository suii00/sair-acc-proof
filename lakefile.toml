name = "ACProof"
version = "0.1.0"
defaultTargets = ["ACProof"]

[leanOptions]
autoImplicit = false
warningAsError = true

# Official AC statement (AC.lean), pinned to the competition commit.
[[require]]
name = "ACStatement"
git = "https://github.com/SAIRcompetition/Andrews-Curtis.git"
rev = "a0fd6e6f52d82c93ccc06ab91d81e8fa3678256e"
subDir = "competition/tools/lean"

# Same Mathlib revision as the official statement.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "5e932f97dd25535344f80f9dd8da3aab83df0fe6"

[[lean_lib]]
name = "ACProof"
globs = ["ACProof.+"]
